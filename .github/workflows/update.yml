name: Update tracker

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull commits into the tracker
        env:
          GITHUB_TOKEN: ${{ secrets.TRACKER_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_tracker.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "built-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Log activity $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
