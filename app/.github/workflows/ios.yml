name: iOS build

# Builds the app in Expo's cloud and sends it to TestFlight. Run it from the
# Actions tab, or push a tag like v1.0.1.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Link the Expo project
        run: eas init --non-interactive --force

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p .secrets
          printf '%s' "$ASC_KEY_P8" > .secrets/asc_key.p8

      - name: Build and submit to TestFlight
        env:
          EXPO_ASC_API_KEY_PATH: .secrets/asc_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
